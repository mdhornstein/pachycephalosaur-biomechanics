[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stegoceras-biomechanics"
version = "0.1.0"
description = "Reproducible computational biomechanics and uncertainty quantification pipeline for Stegoceras validum (UALVP 2)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Research Team" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "pyvista>=0.43.0",
    "trimesh>=4.0.0",
    "meshio>=5.3.0",
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "SALib>=1.4.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.1.0",
    "nbval>=0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stegoceras_biomechanics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
